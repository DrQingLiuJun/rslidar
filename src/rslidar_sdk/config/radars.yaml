common:
  msg_source: 1
  send_packet_ros: false
  send_point_cloud_ros: true

lidar:
  # ================== 第一路雷达 (RS80) ==================
  - driver:
      lidar_type: RS80
      msop_port: 6636
      difop_port: 7736
      imu_port: 0
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.2
      max_distance: 200
      use_lidar_clock: false
      dense_points: false
      pcap_repeat: true
      pcap_rate: 1.0
      pcap_path: /dev/null
      start_angle: 0
      end_angle: 360
      angle_path: ""
      split_frame_mode: 1
      split_angle: 0
      num_blks_split: 0
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
    ros:
      ros_frame_id: rslidar_1
      ros_recv_packet_topic: /rslidar_packets_1
      ros_send_packet_topic: /rslidar_packets_1
      ros_send_point_cloud_topic: /rslidar_points_1
      ros_send_imu_data_topic: /rslidar_imu_1
      ros_queue_length: 10

  # ================== 第二路雷达 (RS80) ==================
  - driver:
      lidar_type: RS80
      msop_port: 6639
      difop_port: 7739
      imu_port: 0
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.2
      max_distance: 200
      use_lidar_clock: false
      dense_points: false
      pcap_repeat: true
      pcap_rate: 1.0
      pcap_path: /dev/null
      start_angle: 0
      end_angle: 360
      angle_path: ""
      split_frame_mode: 1
      split_angle: 0
      num_blks_split: 0
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
    ros:
      ros_frame_id: rslidar_2
      ros_recv_packet_topic: /rslidar_packets_2
      ros_send_packet_topic: /rslidar_packets_2
      ros_send_point_cloud_topic: /rslidar_points_2
      ros_send_imu_data_topic: /rslidar_imu_2
      ros_queue_length: 10

  # ================== 第三路雷达 (RSBP) ==================
  - driver:
      lidar_type: RSBP
      msop_port: 6641
      difop_port: 7741
      imu_port: 0
      user_layer_bytes: 0
      tail_layer_bytes: 0
      min_distance: 0.2
      max_distance: 200
      use_lidar_clock: false
      dense_points: false
      pcap_repeat: true
      pcap_rate: 1.0
      pcap_path: /dev/null
      start_angle: 0
      end_angle: 360
      angle_path: ""
      split_frame_mode: 1
      split_angle: 0
      num_blks_split: 0
      x: 0
      y: 0
      z: 0
      roll: 0
      pitch: 0
      yaw: 0
    ros:
      ros_frame_id: rslidar_3
      ros_recv_packet_topic: /rslidar_packets_3
      ros_send_packet_topic: /rslidar_packets_3
      ros_send_point_cloud_topic: /rslidar_points_3
      ros_send_imu_data_topic: /rslidar_imu_3
      ros_queue_length: 10
